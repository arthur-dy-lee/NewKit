name: NewKit

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.2.0

options:
  bundleIdPrefix: com.codearthur.matrixapps
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  developmentLanguage: en
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "110"
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_STRICT_CONCURRENCY: minimal
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Developer ID Application: bozhu li (XVZHPD648U)"
    DEVELOPMENT_TEAM: XVZHPD648U
    PROVISIONING_PROFILE_SPECIFIER: ""
  configs:
    Release:
      # Required for notarization: strip the get-task-allow debug entitlement and
      # request a secure timestamp from Apple's TSA.
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
      OTHER_CODE_SIGN_FLAGS: "--timestamp"

targets:
  NewKit:
    type: application
    platform: macOS
    sources:
      - path: Sources/App
        excludes:
          - "Info.plist"
          - "NewKit.entitlements"
    dependencies:
      - package: KeyboardShortcuts
      - target: NewKitFinderExtension
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.codearthur.matrixapps.newkit
        PRODUCT_NAME: NewKit
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Sources/App/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/App/NewKit.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO

  newkit:
    type: tool
    platform: macOS
    sources:
      - path: Sources/CLI
    settings:
      base:
        PRODUCT_NAME: newkit
        PRODUCT_BUNDLE_IDENTIFIER: com.codearthur.matrixapps.newkit.cli
        SKIP_INSTALL: YES
        CODE_SIGN_IDENTITY: "-"

  NewKitFinderExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: Sources/FinderExtension
        excludes:
          - "Info.plist"
          - "FinderExtension.entitlements"
      - path: Sources/App/Resources/en.lproj
        buildPhase: resources
      - path: Sources/App/Resources/zh-Hans.lproj
        buildPhase: resources
      - path: Sources/App/SeparatorMenuItemFactory.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.codearthur.matrixapps.newkit.FinderExtension
        PRODUCT_NAME: NewKitFinderExtension
        INFOPLIST_FILE: Sources/FinderExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/FinderExtension/FinderExtension.entitlements
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
