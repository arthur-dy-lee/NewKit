name: NewKit

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.2.0

options:
  bundleIdPrefix: app.newkit
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  developmentLanguage: en
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_STRICT_CONCURRENCY: minimal
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: 0AC02A7107C28C9DDBACF88FE1A9A1F995C38C05
    DEVELOPMENT_TEAM: XVZHPD648U
    PROVISIONING_PROFILE_SPECIFIER: ""

targets:
  NewKit:
    type: application
    platform: macOS
    sources:
      - path: Sources/App
        excludes:
          - "Info.plist"
          - "NewKit.entitlements"
    dependencies:
      - package: KeyboardShortcuts
      - target: NewKitFinderExtension
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.newkit.NewKit
        PRODUCT_NAME: NewKit
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Sources/App/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/App/NewKit.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO

  newkit:
    type: tool
    platform: macOS
    sources:
      - path: Sources/CLI
    settings:
      base:
        PRODUCT_NAME: newkit
        PRODUCT_BUNDLE_IDENTIFIER: app.newkit.cli
        SKIP_INSTALL: YES
        CODE_SIGN_IDENTITY: "-"

  NewKitFinderExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: Sources/FinderExtension
        excludes:
          - "Info.plist"
          - "FinderExtension.entitlements"
      - path: Sources/App/Resources/en.lproj
        buildPhase: resources
      - path: Sources/App/Resources/zh-Hans.lproj
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.newkit.NewKit.FinderExtension
        PRODUCT_NAME: NewKitFinderExtension
        INFOPLIST_FILE: Sources/FinderExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/FinderExtension/FinderExtension.entitlements
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
